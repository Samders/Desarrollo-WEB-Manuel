<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Manuel Naranjo">
  <meta name="description" content="Proyecto">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion commerce</title>
  <title>Login y Registro</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <h1><i class="fas fa-user-circle"></i> Login</h1>
      <form id="login-form">
        <input type="email" placeholder="Correo Electrónico" name="email" required />
        <input type="password" placeholder="Contraseña" name="password" required />
        <button type="submit">Iniciar Sesión</button>
      </form>
      <p>¿No tienes una cuenta? <a href="#" id="show-register">Regístrate aquí</a></p>
    </div>

    <div class="form-wrapper hidden" id="register-section">
      <h1><i class="fas fa-user-plus"></i> Registro</h1>
      <form id="register-form">
        <input type="text" placeholder="Nombre Completo" name="nombre" required />
        <input type="email" placeholder="Correo Electrónico" name="email" required />
        <input type="text" placeholder="Teléfono" name="telefono" required />
        <input type="text" placeholder="Dirección" name="direccion" required />
        <input type="password" placeholder="Contraseña" name="password" required />
        <button type="submit">Registrarse</button>
      </form>
      <p>¿Ya tienes una cuenta? <a href="#" id="show-login">Inicia Sesión</a></p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
